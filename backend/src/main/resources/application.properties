spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/website_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

#Hibernate to create/update tables when spring starts up -> Hibernate reads ContactMessage.java
# -> Hibernate checks the database schema -> Creates or updates contact_messages if needed
# this is useful in development but this is turned off for prod. For prod we can introduce Flyway to manage database
# schema changes through versioned SQL files
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
