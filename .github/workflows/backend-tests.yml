name: Backend Tests

on:
  push:
    branches: [main,master]
  pull_request:
    branches: [main,master]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: Test@1234
                    POSTGRES_DB: website_test_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d website_test_db"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                 distribution: temurin
                 java-version: '21'
                 cache: maven

            - name: Run backend tests
              run: ./mvn -B clean test
              env:
                Test_DB_URL: jdbc:postgresql://localhost:5432/website_test_db
                DB_USERNAME: postgres
                DB_PASSWORD: Test@1234